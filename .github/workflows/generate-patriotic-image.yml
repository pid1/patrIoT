name: Generate Daily Patriotic Image

on:
  # schedule:
  # Run daily at midnight UTC (equivalent to previous systemd timer)
  # - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering for testing

# Least privilege by default; jobs opt in to what they need.
permissions: {}

jobs:
  generate-image:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allow pushing changes back to repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Pin uv itself: unpinned, setup-uv installs the newest uv, even one
          # published inside the 7-day cooldown. Bump to a release 7+ days old.
          version: "0.13.1"

      - name: Install dependencies
        run: uv sync --locked

      - name: Generate patriotic image
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python scripts/generate_image.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add images/
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "Daily patriotic image update - $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            git push
          fi

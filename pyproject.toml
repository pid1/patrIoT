[project]
name = "patriot"
version = "0.1.0"
description = "Generates the daily patriotic image for the MagTag display (scripts/generate_image.py)."
requires-python = ">=3.15"
dependencies = [
    "openai>=3.31.0",
    "pillow>=13.0.0",
]

[tool.uv]
package = false
# Wait a week before resolving newly published versions (supply-chain cooldown).
exclude-newer = "7 days"
# Cooldown exception (factory 2026-10-22): pillow 13.0.0 (published 2026-10-16)
# fixes ~25 advisories, two reachable from scripts/generate_image.py (TIFF
# encoder ColorMap OOB read GHSA-pchr-8j38-3x4p; TIFF decoder uninitialized
# memory GHSA-q45j-58j2-45rg). Capped at 13.0.0 (timestamp), not lifted for
# future releases. Remove after 2026-10-23, once 13.0.0 is a week old.
exclude-newer-package = { pillow = "2026-10-17T00:00:00Z" }

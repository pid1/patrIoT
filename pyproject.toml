[project]
name = "patriot"
version = "0.1.0"
description = "Generates the daily patriotic image for the MagTag display (scripts/generate_image.py)."
requires-python = ">=3.15"
dependencies = [
    "openai>=3.29.0",
    "pillow>=12.3.0",
]

[tool.uv]
package = false
# Wait a week before resolving newly published versions (supply-chain cooldown).
exclude-newer = "7 days"
